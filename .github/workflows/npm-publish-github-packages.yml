name: GDrive Release-Driven Stream Pipeline (Self-Healing)

on:
  workflow_dispatch:
    inputs:
      folder_url:
        description: 'Google Drive 文件夹总链接（仅第 0 轮初始化时必填，后续接力自动留空）'
        required: false
        type: string
      current_index:
        description: '当前处理到第几个文件索引 (从 0 开始)'
        required: true
        default: '0'
      volume_size:
        description: '超 2GB 单文件切片大小 (如 1900m)'
        required: false
        default: '1900m'

jobs:
  release_driven_pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: 1. 检出配置
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: 2. 记录启动时间戳 (用于 6 小时硬超时防断保护)
        id: time_guard
        run: |
          echo "start_epoch=$(date +%s)" >> $GITHUB_OUTPUT
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - name: 3. 初始化或从 Release 描述中恢复持久化任务清单
        id: init_task
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
        run: |
          mkdir -p download_zone
          INPUT_URL="${{ github.event.inputs.folder_url }}"
          START_IDX="${{ github.event.inputs.current_index }}"
          
          BATCH_GROUP=$((START_IDX / 20))
          TIMESTAMP=$(date +%Y%m%d)
          TARGET_TAG="harvest-${TIMESTAMP}-group${BATCH_GROUP}"
          
          echo "target_tag=$TARGET_TAG" >> $GITHUB_OUTPUT

          if [ -n "$INPUT_URL" ]; then
            echo "📁 检测到文件夹总链接，正在云端递归提取所有分卷文件清单..."
            pip install --no-cache-dir gdown > /dev/null 2>&1
            
            python3 -c "
            import gdown, sys
            url = '$INPUT_URL'
            try:
                links = gdown.crawl_url(url)
                if not links:
                    links = [url]
                with open('urls.txt', 'w') as f:
                    for l in links:
                        f.write(l.strip() + '\n')
                print(f'✅ 成功解析，共获取 {len(links)} 个文件。')
            except Exception as e:
                print(f'⚠️ 解析异常: {e}，作为单链接写入...')
                with open('urls.txt', 'w') as f:
                    f.write(url + '\n')
            "
            
            URLS_CONTENT=$(cat urls.txt)
            RELEASE_BODY="🚀 **Google Drive 自动化云端持久化归档流水线**\n\n- 状态: 运行中\n- 总任务源: $INPUT_URL\n\n### 📌 持久化任务清单 (URL Database):\n\`\`\`urls\n$URLS_CONTENT\n\`\`\`"
            
            if ! gh release view "$TARGET_TAG" &>/dev/null; then
              gh release create "$TARGET_TAG" --title "GDrive 归档组 - 组 $BATCH_GROUP" --notes "$RELEASE_BODY"
            else
              gh release edit "$TARGET_TAG" --notes "$RELEASE_BODY"
            fi
            
          else
            echo "🔄 接力模式：正在从 Release ($TARGET_TAG) 描述中提取持久化任务清单..."
            
            if ! gh release view "$TARGET_TAG" &>/dev/null; then
              echo "❌ 错误: 找不到对应的 Release ($TARGET_TAG)，请检查索引或重新初始化！"
              exit 1
            fi
            
            gh release view "$TARGET_TAG" --json body --jq '.body' > release_notes.md
            
            python3 -c "
            import re
            with open('release_notes.md', 'r', encoding='utf-8') as f:
                content = f.read()
            
            match = re.search(r'\`\`\`urls\s*(.*?)\s*\`\``', content, re.DOTALL)
            if match:
                urls_data = match.group(1).strip()
                with open('urls.txt', 'w', encoding='utf-8') as out:
                    out.write(urls_data + '\n')
                print('✅ 成功从 Release 描述中恢复持久化任务清单！')
            else:
                print('❌ 错误: 无法从 Release 描述中找到 ```urls 代码块！')
                sys.exit(1)
            "
          fi

          TOTAL_COUNT=$(wc -l < urls.txt)
          echo "total_count=$TOTAL_COUNT" >> $GITHUB_OUTPUT
          echo "📊 当前任务清单总文件数: $TOTAL_COUNT"

      - name: 4. 智能串行流式处理（含 5 小时硬超时主动安全退出机制）
        id: worker_single
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
        run: |
          START_IDX=${{ github.event.inputs.current_index }}
          TOTAL_COUNT=${{ steps.init_task.outputs.total_count }}
          TARGET_TAG="${{ steps.init_task.outputs.target_tag }}"
          VOL_SIZE="${{ github.event.inputs.volume_size }}"
          START_EPOCH=${{ steps.time_guard.outputs.start_epoch }}
          
          if [ $START_IDX -ge $TOTAL_COUNT ]; then
            echo "🎉 所有几百GB文件已全部顺利搬运完成！"
            echo "is_finished=true" >> $GITHUB_OUTPUT
            echo "timeout_exit=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # 【核心防断机制】检查当前已运行时间。如果超过 5 小时 (18000秒)，主动安全退出并接力！
          CURRENT_EPOCH=$(date +%s)
          ELAPSED=$((CURRENT_EPOCH - START_EPOCH))
          SAFE_LIMIT=18000 # 5 小时安全阈值 (GitHub 6小时硬上限)
          
          if [ $ELAPSED -gt $SAFE_LIMIT ]; then
            echo "⚠️ 警报: 当前 Job 已运行 $((ELAPSED / 3600)) 小时，接近 GitHub 6小时硬超时限制！"
            echo "🛑 为防止被强行杀死导致断档，脚本主动触发平稳安全退出，准备无缝续航接力..."
            echo "next_idx=$START_IDX" >> $GITHUB_OUTPUT
            echo "is_finished=false" >> $GITHUB_OUTPUT
            echo "timeout_exit=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          CURRENT_URL=$(sed -n "$((START_IDX + 1))p" urls.txt | tr -d '\r')
          echo "🎯 正在云端流式处理第 $((START_IDX + 1)) / $TOTAL_COUNT 个文件: $CURRENT_URL"
          
          python3 -c "
          import os, re, subprocess, urllib.parse, sys
          
          url = '$CURRENT_URL'
          target_tag = '$TARGET_TAG'
          vol_size = '$VOL_SIZE'
          dl_dir = os.path.abspath('download_zone')
          
          file_id_match = re.search(r'(?:file/d/|uc\?id=)([a-zA-Z0-9_-]+)', url)
          if not file_id_match:
              file_id = 'direct_file_' + str(abs(hash(url))[:8])
              uc_url = url
          else:
              file_id = file_id_match.group(1)
              uc_url = f'[https://docs.google.com/uc?export=download&id=](https://docs.google.com/uc?export=download&id=){file_id}'
          
          print('🔄 正在实时获取 Google Drive 鉴权与下载确认令牌 (JIT 实时鉴权)...')
          tmp_cookie = f'/tmp/cookie_{file_id}.txt'
          
          get_cmd = ['wget', '--save-cookies', tmp_cookie, '--keep-session-cookies', '--no-check-certificate', '-qO-', uc_url]
          res = subprocess.run(get_cmd, capture_output=True, text=True)
          
          confirm_m = re.search(r'confirm=([0-9A-Za-z_]+)', res.stdout)
          if confirm_m:
              confirm_code = confirm_m.group(1)
              final_url = f'[https://docs.google.com/uc?export=download&confirm=](https://docs.google.com/uc?export=download&confirm=){confirm_code}&id={file_id}'
          else:
              final_url = uc_url
              
          local_path = os.path.join(dl_dir, f'gdrive_{file_id}.bin')
          
          print(f'🚀 开始实时下载分卷文件...')
          dl_cmd = ['wget', '--load-cookies', tmp_cookie, '--no-check-certificate', '-O', local_path, final_url]
          dl_res = subprocess.run(dl_cmd)
          
          if os.path.exists(tmp_cookie):
              os.remove(tmp_cookie)
              
          if dl_res.returncode != 0 or not os.path.exists(local_path):
              print('❌ 下载失败！')
              sys.exit(1)
              
          file_size = os.path.getsize(local_path)
          print(f'✅ 下载成功，当前分卷大小: {file_size / 1024 / 1024:.2f} MB')
          
          max_bytes = 1900 * 1024 * 1024
          files_to_upload = []
          
          if file_size > max_bytes:
              print(f'📦 文件超过 1.9GB 限制，启动 7z 快速切片 (-v{vol_size}, -mx0 仅存储)...')
              archive_base = os.path.join(dl_dir, f'archive_{file_id}.7z')
              split_cmd = ['7z', 'a', f'-v{vol_size}', '-mx0', archive_base, local_path]
              split_res = subprocess.run(split_cmd, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
              
              if split_res.returncode == 0:
                  os.remove(local_path)
                  parent_dir = os.path.dirname(archive_base)
                  base_name = os.path.basename(archive_base)
                  files_to_upload = [
                      os.path.join(parent_dir, f) for f in os.listdir(parent_dir)
                      if f == base_name or f.startswith(f'{base_name}.')
                  ]
                  files_to_upload.sort()
              else:
                  print('⚠️ 7z 切片失败，尝试直接上传原文件...')
                  files_to_upload = [local_path]
          else:
              files_to_upload = [local_path]
              
          for up_file in files_to_upload:
              fname = os.path.basename(up_file)
              print(f'⬆️ 正在流式上传到 Release ({target_tag}): {fname}')
              
              up_ok = False
              for attempt in range(3):
                  up_cmd = ['gh', 'release', 'upload', target_tag, up_file, '--clobber']
                  if subprocess.run(up_cmd).returncode == 0:
                      up_ok = True
                      break
                  print(f'⚠️ 上传重试中 ({attempt+1}/3)...')
                  
              if os.path.exists(up_file):
                  os.remove(up_file)
                  
              if not up_ok:
                  print(f'❌ 文件切片 {fname} 上传失败！')
                  sys.exit(1)
                  
          print(f'🎉 当前分卷流式处理完毕并已彻底清理本地硬盘！')
          "
          
          NEXT_IDX=$((START_IDX + 1))
          echo "next_idx=$NEXT_IDX" >> $GITHUB_OUTPUT
          echo "is_finished=false" >> $GITHUB_OUTPUT
          echo "timeout_exit=false" >> $GITHUB_OUTPUT

      - name: 5. 自动触发下一轮循环接力 (含超时自救触发)
        if: success() && steps.worker_single.outputs.is_finished != 'true'
        run: |
          NEXT_IDX=${{ steps.worker_single.outputs.next_idx }}
          TOTAL_COUNT=${{ steps.init_task.outputs.total_count }}
          TIMEOUT_EXIT=${{ steps.worker_single.outputs.timeout_exit }}
          
          if [ "$TIMEOUT_EXIT" = "true" ]; then
            echo "⏱️ 触发超时自救！当前停留在索引: $NEXT_IDX / $TOTAL_COUNT，正在重新排队开启新 Job 接力..."
          else
            echo "🏁 当前文件处理完毕。准备无缝递归触发下一个文件 (进度: $NEXT_IDX / $TOTAL_COUNT)..."
          fi
          
          gh workflow run "${{ github.workflow }}" \
            -f current_index=$NEXT_IDX \
            -f volume_size="${{ github.event.inputs.volume_size }}"
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
